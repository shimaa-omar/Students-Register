<body>
    <div class="container">
        <div class="container-title">
            <h1><i class="fa-solid fa-graduation-cap"></i>Student Registration</h1>
            <p>Add new student and view thier information</p>
        </div>
        <div class="counter">
            <div>
                <i class="fa-solid fa-person icon"></i>
                <div>
                    <p>Total Student</p>
                    <h2 id="total-count">5<i class="fa-solid fa-people-group"></i></h2>
                </div>
            </div>
            <div>
                <i class="fa-solid fa-child-dress icon"></i>
                <div>
                    <p>Female Student</p>
                    <h2 id="female-count">2<i class="fa-solid fa-people-group"></i></h2>
                </div>
            </div>
            <div>
                <i class="fa-solid fa-person icon"></i>
                <div>
                    <p>Male Student</p>
                    <h2 id="male-count">3<i class="fa-solid fa-people-group"></i></h2>
                </div>
            </div>
        </div>
        <div class="regist">
            <div id="div1">
                <div class="regist-form-title">
                    <h2><i class="fa-solid fa-user-plus"></i>Add New Student</h2>
                    <p>Fill in the details below to register a new Student</p>
                </div>
                <form id="regist-form">
                    <div>
                        <label for="name">Full Name <span>*</span></label>
                        <input type="text" id="name" name="name" required placeholder="Enter your name">
                    </div>
                    <div>
                        <label for="age">Age <span>*</span></label>
                        <input type="number" id="age" name="age" required placeholder="Enter your age">
                    </div>
                    <div>
                        <label for="Course-name">Course Name <span>*</span></label>
                        <select id="Course-name">
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JS">JS</option>
                        </select>
                    </div>
                    <div>
                        <label for="grade">Grade <span>*</span></label>
                        <input type="number" id="grade" name="grade" required placeholder="Enter your grade" min="0" max="100">
                    </div>
                    <div>
                        <input type="submit" value="+ Add Student">
                    </div>
                </form>
            </div>
            <div id="div2">
                <div id="empty">
                    <h2>There are no students.</h2>
